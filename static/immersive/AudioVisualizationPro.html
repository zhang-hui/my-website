<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Audio: Motion Tracking Logic</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root { 
            --neon-blue: #ffffff; 
            --neon-pink: #ff00ff; 
            --bg-color: #050505; 
            --ui-gray: rgba(200, 200, 200, 0.7); 
        }
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: var(--bg-color); 
            color: white; 
            font-family: -apple-system, sans-serif; 
            overflow: hidden; 
        }
        
        #metadata-center {
            position: absolute; top: 75%; left: 50%; transform: translateX(-50%);
            text-align: center; width: 90%; pointer-events: none; z-index: 8;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }
        #meta-title { font-size: 2.4rem; font-weight: 700; margin-bottom: 10px; color: white; }
        #meta-info { font-size: 1.3rem; font-weight: 400; color: rgba(255, 255, 255, 0.55); }

        #ui-overlay { position: absolute; bottom: 25px; left: 25px; pointer-events: none; z-index: 10; }
        .hud-panel { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.1); padding: 12px 18px; border-radius: 8px; backdrop-filter: blur(12px); min-width: 180px; }
        #gesture-hint { font-size: 0.85rem; color: var(--ui-gray); letter-spacing: 2px; font-weight: bold; text-transform: uppercase; }
        #lock-progress { font-size: 0.75rem; color: var(--neon-blue); margin-top: 5px; height: 1.2em; font-family: monospace; }

        #webcam-preview { position: absolute; bottom: 25px; right: 25px; width: 180px; height: 135px; border: 1px solid rgba(255,255,255,0.2); transform: scaleX(-1); border-radius: 8px; opacity: 0.4; }
        #loader { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .cyber-btn { pointer-events: auto; margin: 10px; padding: 16px 32px; background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); cursor: pointer; transition: 0.3s; font-weight: bold; }
        #file-input { display: none; }
        canvas { display: block; }

        /* 音量控制 Toast 样式 */
        #volume-toast {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-pink);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(16px);
            z-index: 99;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.3);
        }
        #volume-toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #volume-icon {
            font-size: 1.4rem;
            color: var(--neon-pink);
        }
        .volume-bar-container {
            width: 150px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        #volume-bar {
            height: 100%;
            width: 70%;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
            transition: width 0.08s ease;
        }
        #volume-text {
            font-family: monospace;
            font-size: 1rem;
            color: white;
            min-width: 45px;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="loader">
    <div id="loading-text" style="color: var(--neon-blue); letter-spacing: 8px; margin-bottom: 20px;">V-LINK INITIALIZING...</div>
    <div id="setup-container" style="display: none;">
        <input type="file" id="file-input" accept="audio/*" multiple>
        <button class="cyber-btn" onclick="document.getElementById('file-input').click()">LOAD AUDIO FILES</button>
        <div id="file-count" style="color: var(--neon-pink); margin-top: 12px; font-size: 0.85rem;"></div>
        <button id="start-btn" class="cyber-btn" style="display: none;" onclick="startExperience()">CONNECT INTERFACE</button>
    </div>
</div>

<div id="metadata-center">
    <div id="meta-title">SYSTEM READY</div>
    <div id="meta-info">Awaiting User Stream</div>
</div>

<div id="ui-overlay">
    <div class="hud-panel">
        <div id="gesture-hint">V-LINK ACTIVE</div>
        <div id="lock-progress">SCANNING...</div>
    </div>
</div>

<!-- 音量控制 Toast -->
<div id="volume-toast">
    <div id="volume-icon">🔊</div>
    <div class="volume-bar-container">
        <div id="volume-bar"></div>
    </div>
    <div id="volume-text">70%</div>
</div>

<video id="webcam-preview" autoplay playsinline muted></video>
<canvas id="visualizer"></canvas>

<script type="module">
    // --- 拦截并屏蔽 MediaPipe 内部输出到 console.error 的非关键性提示日志 ---
    const originalError = console.error;
    console.error = function(...args) {
        if (args[0] && typeof args[0] === 'string' && 
            (args[0].includes('XNNPACK') || args[0].includes('TensorFlow Lite') || args[0].includes('delegate'))) {
            return; 
        }
        originalError.apply(console, args);
    };

    const originalWarn = console.warn;
    console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && 
            (args[0].includes('XNNPACK') || args[0].includes('TensorFlow Lite') || args[0].includes('delegate'))) {
            return; 
        }
        originalWarn.apply(console, args);
    };

    import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    let audioContext, analyserL, analyserR, dataL, dataR;
    let gestureRecognizer, isPlaying = false, playlist = [], currentTrackIndex = 0;
    let audioTag = new Audio();
    let smoothCenterX = window.innerWidth / 2;
    let gestureLock = false, lastGestureTime = 0;
    
    // --- 逻辑变量 ---
    let palmActiveTimer = 0; 
    let isReadyForMove = false; 
    let startX = 0;
    const PALM_MIN_REQUIRED = 8; // 约0.5s (基于检测频率)
    const MOVE_THRESHOLD = 0.15; // 位移阈值 (屏幕宽度的15%)

    // --- 音量手势控制变量 ---
    let volumeGestureTimer = 0;
    let isReadyForVolume = false;
    let preMutedVolume = 0.7; // 默认静音前的音量
    let isMuted = false;
    let toastTimeout = null;
    let smoothVolume = 0.7; // 用于音量平滑过渡的目标值
    let startVolumeY = 0;       // 新增：锁定手势时的起始手部Y坐标基准
    let startVolumeLevel = 0.7; // 新增：锁定手势时的起始系统音量

    let mainHue = Math.random() * 360; 
    let smoothEnergy = 0, globalTime = 0;
    let freqSegments = new Array(8).fill(0); 

    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d', { alpha: false });
    const burstParticles = [];

    // 初始化音量
    audioTag.volume = 0.7;

    class BurstParticle {
        constructor() { this.active = false; }
        init(x, y, angle, power, hue) {
            this.x = x; this.y = y;
            const speed = (1 + power * 50) * (0.8 + Math.random() * 0.4);
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.life = 1.0; this.baseSize = 8 + Math.random() * 15; 
            this.hue = hue; this.active = true;
            return this;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.96; this.vy *= 0.96; this.life -= 0.015; 
            if (this.life <= 0) this.active = false;
        }
    }

    function updateMetadata(file) {
        window.jsmediatags.read(file, {
            onSuccess: (tag) => {
                const { title, artist, album } = tag.tags;
                document.getElementById('meta-title').innerText = title || file.name.replace(/\.[^/.]+$/, "");
                document.getElementById('meta-info').innerText = `${artist || "Unknown Artist"} — ${album || "Unknown Album"}`;
            },
            onError: () => {
                document.getElementById('meta-title').innerText = file.name.replace(/\.[^/.]+$/, "");
                document.getElementById('meta-info').innerText = "Unknown Metadata";
            }
        });
    }

    function initAudio() {
        if (audioContext) return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaElementSource(audioTag);
        analyserL = audioContext.createAnalyser(); analyserR = audioContext.createAnalyser();
        analyserL.fftSize = 512; analyserR.fftSize = 512;
        dataL = new Uint8Array(analyserL.frequencyBinCount);
        dataR = new Uint8Array(analyserR.frequencyBinCount);
        const splitter = audioContext.createChannelSplitter(2);
        source.connect(splitter);
        splitter.connect(analyserL, 0); splitter.connect(analyserR, 1);
        const merger = audioContext.createChannelMerger(2);
        analyserL.connect(merger, 0, 0); analyserR.connect(merger, 0, 1);
        merger.connect(audioContext.destination);
        loadTrack(0);
    }

    function loadTrack(index) {
        if (playlist.length === 0) return;
        currentTrackIndex = (index + playlist.length) % playlist.length;
        const track = playlist[currentTrackIndex];
        audioTag.src = track.url;
        audioTag.load();
        updateMetadata(track.file);
        if (isPlaying) audioTag.play().catch(() => {});
    }

    function render(time) {
        globalTime = time;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (analyserL && isPlaying && !audioTag.paused) {
            analyserL.getByteFrequencyData(dataL);
            analyserR.getByteFrequencyData(dataR);
            const binSize = Math.floor(dataL.length / 8);
            for (let s = 0; s < 8; s++) {
                let segSum = 0;
                for (let i = 0; i < binSize; i++) segSum += (dataL[s * binSize + i] + dataR[s * binSize + i]) / 2;
                freqSegments[s] = segSum / binSize / 255;
            }
            smoothEnergy += (freqSegments.reduce((a,b)=>a+b)/8 - smoothEnergy) * 0.3;
            const bL = dataL.reduce((a,b)=>a+b);
            const bR = dataR.reduce((a,b)=>a+b);
            const targetX = (canvas.width / 2) + ((bL - bR) / (bL + bR + 1)) * (canvas.width * 5.0); 
            smoothCenterX += (targetX - smoothCenterX) * 0.15;
        }

        const centerY = canvas.height / 2.4; mainHue += 0.4;
        ctx.globalCompositeOperation = 'lighter';
        const coreRadius = 15 + smoothEnergy * 35;
        ctx.save(); ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2 + globalTime * 0.002;
            const r = coreRadius + (smoothEnergy * 15) * (Math.random() - 0.5);
            ctx.lineTo(smoothCenterX + Math.cos(ang) * r, centerY + Math.sin(ang) * r);
        }
        ctx.closePath();
        ctx.shadowBlur = 30; ctx.shadowColor = `hsla(${mainHue}, 100%, 70%, 0.8)`;
        ctx.fillStyle = `hsla(${mainHue}, 100%, 90%, ${Math.max(0.4, smoothEnergy * 2)})`;
        ctx.fill(); ctx.restore();

        if (isPlaying && analyserL) {
            for (let s = 0; s < 8; s++) {
                if (freqSegments[s] > 0.12) {
                    const burstCount = Math.floor(freqSegments[s] * 12);
                    for (let i = 0; i < burstCount; i++) {
                        const spreadAngle = (s/8)*Math.PI*2 + (Math.random()-0.5)*(Math.PI/4);
                        burstParticles.push(new BurstParticle().init(smoothCenterX, centerY, spreadAngle, freqSegments[s], mainHue + (s*15)));
                    }
                }
            }
        }
        for (let i = burstParticles.length - 1; i >= 0; i--) {
            const p = burstParticles[i]; p.update();
            if (!p.active) { burstParticles.splice(i, 1); continue; }
            ctx.beginPath(); ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${p.life * 0.7})`;
            ctx.arc(p.x, p.y, (p.baseSize * p.life) / 2, 0, Math.PI * 2); ctx.fill();
        }
        if (time - lastGestureTime > 60) { detectGestures(time); lastGestureTime = time; }
        requestAnimationFrame(render);
    }

    // 显示并更新音量 Toast 界面
    function showVolumeToast(volume, muteStatusText = null) {
        const toast = document.getElementById('volume-toast');
        const bar = document.getElementById('volume-bar');
        const txt = document.getElementById('volume-text');
        const icon = document.getElementById('volume-icon');

        toast.classList.add('visible');

        if (muteStatusText) {
            bar.style.width = `0%`;
            txt.innerText = muteStatusText;
            icon.innerText = "🔇";
        } else {
            const volPct = Math.round(volume * 100);
            bar.style.width = `${volPct}%`;
            txt.innerText = `${volPct}%`;
            if (volPct === 0) icon.innerText = "🔇";
            else if (volPct < 35) icon.innerText = "🔈";
            else if (volPct < 75) icon.innerText = "🔉";
            else icon.innerText = "🔊";
        }

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('visible');
        }, 1500);
    }

    // 手指距离辅助计算
    function getDistance(pt1, pt2) {
        return Math.sqrt(Math.pow(pt1.x - pt2.x, 2) + Math.pow(pt1.y - pt2.y, 2));
    }

    async function detectGestures(now) {
        if (!gestureRecognizer || document.getElementById('webcam-preview').readyState < 2) return;
        const results = gestureRecognizer.recognizeForVideo(document.getElementById('webcam-preview'), now);
        
        if (results.landmarks && results.landmarks.length > 0) {
            const landmarks = results.landmarks[0];
            const wrist = landmarks[0];
            
            // 提取关键骨骼点的物理长度（用于判断手指舒张或弯曲，不受手掌远近大小缩放干扰）
            const dThumb = getDistance(landmarks[4], wrist);
            const dIndex = getDistance(landmarks[8], wrist);
            const dMiddle = getDistance(landmarks[12], wrist);
            const dRing = getDistance(landmarks[16], wrist);
            const dPinky = getDistance(landmarks[20], wrist);

            // 根关节对比基准线
            const refThumb = getDistance(landmarks[2], wrist);
            const refIndex = getDistance(landmarks[5], wrist);
            const refMiddle = getDistance(landmarks[9], wrist);
            const refRing = getDistance(landmarks[13], wrist);
            const refPinky = getDistance(landmarks[17], wrist);

            // 精准且具有包容度的手指舒张比例计算
            const isThumbCurved = dThumb < refThumb * 1.30; 
            const isPinkyCurved = dPinky < refPinky * 1.25; 
            const isIndexExtended = dIndex > refIndex * 1.22;
            const isMiddleExtended = dMiddle > refMiddle * 1.22;
            const isRingExtended = dRing > refRing * 1.22;

            // ==========================================
            // 【核心手势 1】三指音量控制（食、中、无指伸直，大拇、小拇卷曲/握起）
            // ==========================================
            const isThreeFingersUp = isIndexExtended && isMiddleExtended && isRingExtended && isThumbCurved && isPinkyCurved;

            // ==========================================
            // 【核心手势 2】贴面静音判定（仅食指指天舒展，其余全卷缩，且高度在面部上半段 Y < 0.42）
            // ==========================================
            const isMuteGesture = isIndexExtended && !isMiddleExtended && !isRingExtended && isPinkyCurved;

            // ==========================================
            // 【核心手势 3】OK 手势恢复判定（大拇指指尖贴近食指指尖，且中、无、小指自然放开）
            // ==========================================
            const isOKCombination = getDistance(landmarks[4], landmarks[8]) < 0.055 && isMiddleExtended && isRingExtended;

            // ------------------------------------------
            // 优先拦截与执行：音量及静音交互手势
            // ------------------------------------------
            
            // A. 三指相对增量音量滑动控制（高敏模式）
            if (isThreeFingersUp && !gestureLock) {
                resetMoveState(); // 抑制切歌/切歌锁定计时器

                if (!isReadyForVolume) {
                    volumeGestureTimer++;
                    document.getElementById('lock-progress').innerText = `VOL SCAN... ${"█".repeat(volumeGestureTimer)}`;
                    
                    if (volumeGestureTimer >= 4) { // 降低锁定时长阈值至4帧（约0.25秒），获得更迅速的触发反馈
                        isReadyForVolume = true;
                        startVolumeY = landmarks[9].y; // 锁定激活瞬间手部的 Y 坐标基准点
                        startVolumeLevel = audioTag.volume; // 暂存激活瞬间的播放器音量
                        document.getElementById('lock-progress').innerText = "VOL LOCKED: SLIDE VERTICAL";
                    }
                } else {
                    document.getElementById('lock-progress').innerText = "[VOL DETECTED]";
                    
                    const currentY = landmarks[9].y; // 跟踪中指根关节高度
                    
                    // 计算相对初始位置的 Y 轴偏离量
                    // 因为坐标系 Y 越小代表手越高，所以 startVolumeY - currentY > 0 代表手向上移动
                    const deltaY = startVolumeY - currentY; 

                    // 引入高灵敏度增益系数 (3.0×)。即手部只需移动 33% 画面高度就可以调节 100% 的音量
                    const sensitivity = 3.0; 
                    let targetVolume = startVolumeLevel + (deltaY * sensitivity);

                    // 夹持范围控制
                    targetVolume = Math.max(0, Math.min(1, targetVolume));

                    // 一阶平滑低通滤波，消除多帧手部抖动，保障调音舒适度
                    smoothVolume += (targetVolume - smoothVolume) * 0.35;
                    audioTag.volume = Math.max(0, Math.min(1, smoothVolume));
                    isMuted = false;
                    showVolumeToast(audioTag.volume);
                }
                return; // 直接返回拦截，阻止流转到原有切歌和暂停逻辑
            } else {
                volumeGestureTimer = 0;
                isReadyForVolume = false;
            }

            // B. 食指立起一键静音
            if (isMuteGesture && !gestureLock) {
                if (landmarks[8].y < 0.42) { // 限制在面部及中高部敏感区
                    if (!isMuted) {
                        preMutedVolume = audioTag.volume; // 保存静音前的音量
                        audioTag.volume = 0;
                        smoothVolume = 0;
                        isMuted = true;
                        triggerCommand("MUTE", () => {
                            showVolumeToast(0, "MUTED");
                        });
                    }
                }
                return; 
            }

            // C. OK 手势恢复音量
            if (isOKCombination && isMuted && !gestureLock) {
                audioTag.volume = preMutedVolume;
                smoothVolume = preMutedVolume;
                isMuted = false;
                triggerCommand("RESTORE", () => {
                    showVolumeToast(preMutedVolume);
                });
                return; 
            }

            // ------------------------------------------
            // 降级执行：原有歌曲播放控制逻辑 (仅在无音量动作时生效)
            // ------------------------------------------
            if (results.gestures && results.gestures.length > 0) {
                const gesture = results.gestures[0][0].categoryName;
                const currentX = landmarks[9].x;

                // 1. 拳头立即暂停
                if (gesture === "Closed_Fist") {
                    if (isPlaying) {
                        isPlaying = false; 
                        audioTag.pause(); 
                        triggerCommand("PAUSE");
                    }
                    resetMoveState();
                    return;
                }

                // 2. 伸开手掌切歌逻辑
                if (gesture === "Open_Palm") {
                    if (!isReadyForMove) {
                        palmActiveTimer++;
                        document.getElementById('lock-progress').innerText = `READYING... ${"█".repeat(palmActiveTimer)}`;
                        
                        if (palmActiveTimer >= PALM_MIN_REQUIRED) {
                            isReadyForMove = true;
                            startX = currentX; // 锁定初始滑动起点
                            if (!isPlaying) { isPlaying = true; audioTag.play().catch(() => {}); }
                            document.getElementById('lock-progress').innerText = "READY: MOVE SIDEWAYS";
                        }
                    } else {
                        const deltaX = currentX - startX;
                        if (deltaX < -MOVE_THRESHOLD) {
                            triggerCommand("NEXT", () => loadTrack(currentTrackIndex + 1));
                        } else if (deltaX > MOVE_THRESHOLD) {
                            triggerCommand("PREV", () => loadTrack(currentTrackIndex - 1));
                        }
                    }
                } else {
                    resetMoveState();
                }
            } else {
                resetMoveState();
            }
        } else if (!gestureLock) {
            resetMoveState();
            volumeGestureTimer = 0;
            isReadyForVolume = false;
        }
    }

    function resetMoveState() {
        isReadyForMove = false;
        palmActiveTimer = 0;
        if (!gestureLock) document.getElementById('lock-progress').innerText = "V-LINK ACTIVE";
    }

    function triggerCommand(label, action) {
        gestureLock = true;
        isReadyForMove = false;
        palmActiveTimer = 0;
        document.getElementById('gesture-hint').innerText = label;
        document.getElementById('lock-progress').innerText = "EXECUTED";
        if(action) action();
        setTimeout(() => { 
            gestureLock = false; 
            document.getElementById('gesture-hint').innerText = isPlaying ? "V-LINK ACTIVE" : "PAUSED"; 
            document.getElementById('lock-progress').innerText = "SCANNING...";
        }, 1500);
    }

    document.getElementById('file-input').onchange = (e) => {
        playlist = Array.from(e.target.files).map(f => ({ file: f, url: URL.createObjectURL(f) }));
        document.getElementById('file-count').innerText = `${playlist.length} TRACKS LOADED`;
        document.getElementById('start-btn').style.display = 'block';
    };

    window.startExperience = () => { 
        if (document.documentElement.requestFullscreen) {
            try {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.warn("全屏请求被环境安全政策拦截:", err.message);
                });
            } catch (e) {}
        }
        document.getElementById('loader').style.display = 'none'; 
        initAudio(); isPlaying = true; audioTag.play().catch(() => {}); 
    };

    async function setup() {
        try {
            const v = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            gestureRecognizer = await GestureRecognizer.createFromOptions(v, { 
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task", delegate: "GPU" }, 
                runningMode: "VIDEO", numHands: 1 
            });
            const s = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('webcam-preview').srcObject = s;
            document.getElementById('setup-container').style.display = 'block';
        } catch (e) { document.getElementById('loading-text').innerText = "CAMERA ERROR"; }
    }

    window.onload = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; setup(); requestAnimationFrame(render); };
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
</script>
</body>
</html>
