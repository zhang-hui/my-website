<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Audio: Relative Directional Logic</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root { --neon-blue: #ffffff; --neon-pink: #ff00ff; --bg-color: #050505; --ui-gray: rgba(200, 200, 200, 0.7); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-color); color: white; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        #metadata-center {
            position: absolute; top: 75%; left: 50%; transform: translateX(-50%);
            text-align: center; width: 90%; pointer-events: none; z-index: 8;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }
        #meta-title { font-size: 2.4rem; font-weight: 700; margin-bottom: 10px; color: white; }
        #meta-info { font-size: 1.3rem; font-weight: 400; color: rgba(255, 255, 255, 0.55); }

        #ui-overlay { position: absolute; bottom: 25px; left: 25px; pointer-events: none; z-index: 10; }
        .hud-panel { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.1); padding: 12px 18px; border-radius: 8px; backdrop-filter: blur(12px); min-width: 180px; }
        #gesture-hint { font-size: 0.85rem; color: var(--ui-gray); letter-spacing: 2px; font-weight: bold; text-transform: uppercase; }
        #lock-progress { font-size: 0.75rem; color: var(--neon-blue); margin-top: 5px; height: 1.2em; font-family: monospace; }

        #webcam-preview { position: absolute; bottom: 25px; right: 25px; width: 180px; height: 135px; border: 1px solid rgba(255,255,255,0.2); transform: scaleX(-1); border-radius: 8px; opacity: 0.4; }
        #loader { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .cyber-btn { pointer-events: auto; margin: 10px; padding: 16px 32px; background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); cursor: pointer; transition: 0.3s; font-weight: bold; }
        #file-input { display: none; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="loader">
    <div id="loading-text" style="color: var(--neon-blue); letter-spacing: 8px; margin-bottom: 20px;">V-LINK INITIALIZING...</div>
    <div id="setup-container" style="display: none;">
        <input type="file" id="file-input" accept="audio/*" multiple>
        <button class="cyber-btn" onclick="document.getElementById('file-input').click()">LOAD AUDIO FILES</button>
        <div id="file-count" style="color: var(--neon-pink); margin-top: 12px; font-size: 0.85rem;"></div>
        <button id="start-btn" class="cyber-btn" style="display: none;" onclick="startExperience()">CONNECT INTERFACE</button>
    </div>
</div>

<div id="metadata-center">
    <div id="meta-title">SYSTEM READY</div>
    <div id="meta-info">Awaiting User Stream</div>
</div>

<div id="ui-overlay">
    <div class="hud-panel">
        <div id="gesture-hint">V-LINK ACTIVE</div>
        <div id="lock-progress">SCANNING...</div>
    </div>
</div>

<video id="webcam-preview" autoplay playsinline muted></video>
<canvas id="visualizer"></canvas>

<script type="module">
    import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    let audioContext, analyserL, analyserR, dataL, dataR;
    let gestureRecognizer, isPlaying = false, playlist = [], currentTrackIndex = 0;
    let audioTag = new Audio();
    let smoothCenterX = window.innerWidth / 2;
    let gestureLock = false, lastGestureTime = 0;
    
    // --- 逻辑变量 ---
    let holdTimer = 0; 
    let palmActiveTimer = 0; 
    let targetCommand = null;
    const HOLD_REQUIRED = 16; // 约2秒
    const PALM_MIN_REQUIRED = 8; // 0.5s 

    let mainHue = Math.random() * 360; 
    let smoothEnergy = 0, globalTime = 0;
    let freqSegments = new Array(8).fill(0); 

    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d', { alpha: false });
    const burstParticles = [];

    class BurstParticle {
        constructor() { this.active = false; }
        init(x, y, angle, power, hue) {
            this.x = x; this.y = y;
            const speed = (1 + power * 50) * (0.8 + Math.random() * 0.4);
            this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
            this.life = 1.0; this.baseSize = 8 + Math.random() * 15; 
            this.hue = hue; this.active = true;
            return this;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.96; this.vy *= 0.96; this.life -= 0.015; 
            if (this.life <= 0) this.active = false;
        }
    }

    function updateMetadata(file) {
        window.jsmediatags.read(file, {
            onSuccess: (tag) => {
                const { title, artist, album } = tag.tags;
                document.getElementById('meta-title').innerText = title || file.name.replace(/\.[^/.]+$/, "");
                document.getElementById('meta-info').innerText = `${artist || "Unknown Artist"} — ${album || "Unknown Album"}`;
            },
            onError: () => {
                document.getElementById('meta-title').innerText = file.name.replace(/\.[^/.]+$/, "");
                document.getElementById('meta-info').innerText = "Unknown Metadata";
            }
        });
    }

    function initAudio() {
        if (audioContext) return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaElementSource(audioTag);
        analyserL = audioContext.createAnalyser(); analyserR = audioContext.createAnalyser();
        analyserL.fftSize = 512; analyserR.fftSize = 512;
        dataL = new Uint8Array(analyserL.frequencyBinCount);
        dataR = new Uint8Array(analyserR.frequencyBinCount);
        const splitter = audioContext.createChannelSplitter(2);
        source.connect(splitter);
        splitter.connect(analyserL, 0); splitter.connect(analyserR, 1);
        const merger = audioContext.createChannelMerger(2);
        analyserL.connect(merger, 0, 0); analyserR.connect(merger, 0, 1);
        merger.connect(audioContext.destination);
        loadTrack(0);
    }

    function loadTrack(index) {
        if (playlist.length === 0) return;
        currentTrackIndex = (index + playlist.length) % playlist.length;
        const track = playlist[currentTrackIndex];
        audioTag.src = track.url;
        audioTag.load();
        updateMetadata(track.file);
        if (isPlaying) audioTag.play().catch(() => {});
    }

    function render(time) {
        globalTime = time;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (analyserL && isPlaying && !audioTag.paused) {
            analyserL.getByteFrequencyData(dataL);
            analyserR.getByteFrequencyData(dataR);
            const binSize = Math.floor(dataL.length / 8);
            for (let s = 0; s < 8; s++) {
                let segSum = 0;
                for (let i = 0; i < binSize; i++) segSum += (dataL[s * binSize + i] + dataR[s * binSize + i]) / 2;
                freqSegments[s] = segSum / binSize / 255;
            }
            smoothEnergy += (freqSegments.reduce((a,b)=>a+b)/8 - smoothEnergy) * 0.3;
            const bL = dataL.reduce((a,b)=>a+b);
            const bR = dataR.reduce((a,b)=>a+b);
            const targetX = (canvas.width / 2) + ((bL - bR) / (bL + bR + 1)) * (canvas.width * 5.0); 
            smoothCenterX += (targetX - smoothCenterX) * 0.15;
        }

        const centerY = canvas.height / 2.4; mainHue += 0.4;
        ctx.globalCompositeOperation = 'lighter';
        const coreRadius = 15 + smoothEnergy * 35;
        ctx.save(); ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2 + globalTime * 0.002;
            const r = coreRadius + (smoothEnergy * 15) * (Math.random() - 0.5);
            ctx.lineTo(smoothCenterX + Math.cos(ang) * r, centerY + Math.sin(ang) * r);
        }
        ctx.closePath();
        ctx.shadowBlur = 30; ctx.shadowColor = `hsla(${mainHue}, 100%, 70%, 0.8)`;
        ctx.fillStyle = `hsla(${mainHue}, 100%, 90%, ${Math.max(0.4, smoothEnergy * 2)})`;
        ctx.fill(); ctx.restore();

        if (isPlaying && analyserL) {
            for (let s = 0; s < 8; s++) {
                if (freqSegments[s] > 0.12) {
                    const burstCount = Math.floor(freqSegments[s] * 12);
                    for (let i = 0; i < burstCount; i++) {
                        const spreadAngle = (s/8)*Math.PI*2 + (Math.random()-0.5)*(Math.PI/4);
                        burstParticles.push(new BurstParticle().init(smoothCenterX, centerY, spreadAngle, freqSegments[s], mainHue + (s*15)));
                    }
                }
            }
        }
        for (let i = burstParticles.length - 1; i >= 0; i--) {
            const p = burstParticles[i]; p.update();
            if (!p.active) { burstParticles.splice(i, 1); continue; }
            ctx.beginPath(); ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, ${p.life * 0.7})`;
            ctx.arc(p.x, p.y, (p.baseSize * p.life) / 2, 0, Math.PI * 2); ctx.fill();
        }
        if (time - lastGestureTime > 60) { detectGestures(time); lastGestureTime = time; }
        requestAnimationFrame(render);
    }

    async function detectGestures(now) {
        if (!gestureRecognizer || document.getElementById('webcam-preview').readyState < 2) return;
        const results = gestureRecognizer.recognizeForVideo(document.getElementById('webcam-preview'), now);
        
        let detectedAction = null;

        if (results.gestures.length > 0) {
            const gesture = results.gestures[0][0].categoryName;
            const l = results.landmarks[0];
            
            // 1. 播放/暂停 (逻辑优化：必须先有张开状态)
            if (gesture === "Open_Palm") {
                palmActiveTimer++;
                if (!isPlaying && palmActiveTimer > 5) {
                    isPlaying = true; audioTag.play(); triggerCommand("PLAY");
                }
            } else if (gesture === "Closed_Fist") {
                if (isPlaying && palmActiveTimer >= PALM_MIN_REQUIRED) {
                    isPlaying = false; audioTag.pause(); triggerCommand("PAUSE");
                }
                palmActiveTimer = 0;
            }

            // 2. 拇指方向判定 (忽略内置 Thumb_Up 分类)
            const thumbTip = l[4]; 
            const thumbIP = l[3];  
            const thumbBase = l[2];
            
            // 判定是否处于“伸出大拇指”的状态：拇指尖距离根部要足够远，且其他手指闭合
            // 简单逻辑：只要 thumbTip 在 X 轴上偏离 thumbIP 较多，且 Y 轴相对平齐，即视为“指点”
            const dx = thumbTip.x - thumbIP.x;
            const dy = Math.abs(thumbTip.y - thumbIP.y);

            if (Math.abs(dx) > 0.04 && dy < 0.1) {
                // 镜像画面中：
                // dx < 0 (指尖在图像左侧) -> 物理右方 (NEXT)
                // dx > 0 (指尖在图像右侧) -> 物理左方 (PREV)
                if (dx < -0.04) detectedAction = "NEXT";
                else if (dx > 0.04) detectedAction = "PREV";
            }
        } else {
            palmActiveTimer = 0;
        }

        // 3. 2秒计时逻辑
        if (detectedAction && !gestureLock) {
            if (targetCommand === detectedAction) {
                holdTimer++;
                const bar = "█".repeat(Math.floor((holdTimer/HOLD_REQUIRED)*10));
                document.getElementById('lock-progress').innerText = `${targetCommand} LOCKING ${bar}`;
                if (holdTimer >= HOLD_REQUIRED) {
                    if (targetCommand === "NEXT") triggerCommand("NEXT", () => loadTrack(currentTrackIndex + 1));
                    else triggerCommand("PREV", () => loadTrack(currentTrackIndex - 1));
                    holdTimer = 0; targetCommand = null;
                }
            } else {
                targetCommand = detectedAction; holdTimer = 0;
            }
        } else {
            holdTimer = 0; targetCommand = null;
            if (!gestureLock) document.getElementById('lock-progress').innerText = "V-LINK ACTIVE";
        }
    }

    function triggerCommand(label, action) {
        gestureLock = true;
        document.getElementById('gesture-hint').innerText = label;
        document.getElementById('lock-progress').innerText = "EXECUTED";
        if(action) action();
        setTimeout(() => { 
            gestureLock = false; 
            document.getElementById('gesture-hint').innerText = isPlaying ? "V-LINK ACTIVE" : "PAUSED"; 
            document.getElementById('lock-progress').innerText = "SCANNING...";
        }, 1500);
    }

    document.getElementById('file-input').onchange = (e) => {
        playlist = Array.from(e.target.files).map(f => ({ file: f, url: URL.createObjectURL(f) }));
        document.getElementById('file-count').innerText = `${playlist.length} TRACKS LOADED`;
        document.getElementById('start-btn').style.display = 'block';
    };

    window.startExperience = () => { 
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        document.getElementById('loader').style.display = 'none'; 
        initAudio(); isPlaying = true; audioTag.play(); 
    };

    async function setup() {
        try {
            const v = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            gestureRecognizer = await GestureRecognizer.createFromOptions(v, { 
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task", delegate: "GPU" }, 
                runningMode: "VIDEO", numHands: 1 
            });
            const s = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('webcam-preview').srcObject = s;
            document.getElementById('setup-container').style.display = 'block';
        } catch (e) { document.getElementById('loading-text').innerText = "CAMERA ERROR"; }
    }

    window.onload = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; setup(); requestAnimationFrame(render); };
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
</script>
</body>
</html>
